name: Check companion features

on:
  push:
    branches:
      - feat/companion-five-tools-20261110
      - feat/ux-3-clarity-20261110
      - feat/ui-polish-20261110
      - feat/cloudflare-web-analytics-20261110
      - feat/first-feedback-ux-share-20261111
  pull_request:
    paths:
      - index.html
      - companion.js
      - companion.css
      - polish.css
      - feedback.css
      - sw.js
      - .github/workflows/check-companion.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check companion.js
          node --check mood-cosmos.js
          node --check screenings.js
          node --check sleep.js
          node --check support.js
          node --check wellbeing.js
          node --check guide.js
          node --check sw.js
      - name: Inline app JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:(?!>).)*>(.*?)</script>',html,re.DOTALL|re.IGNORECASE)
          inline=[s for s in scripts if 'function showTab(n)' in s]
          assert len(inline)==1
          Path('/tmp/dnevnik-app-inline.js').write_text(inline[0],encoding='utf-8')
          PY
          node --check /tmp/dnevnik-app-inline.js
      - name: Integration and compatibility invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('companion.js').read_text(encoding='utf-8')
          css=Path('companion.css').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          polish=Path('polish.css').read_text(encoding='utf-8')
          feedback=Path('feedback.css').read_text(encoding='utf-8')
          assert '<script src="companion.js" defer></script>' in html
          assert '<link rel="stylesheet" href="companion.css">' in html
          assert 'var KEY="dnevnik-v1",CK="dnevnik-cfg-v1"' in html
          assert 'var COLLECTION=' in html
          assert 'window.DnevnikCompanion.importData(importedCompanion)' in html
          assert 'companion:companionData' in html
          assert 'function makeCalm()' in js
          assert 'function makeEvents()' in js
          assert 'function makeInsights()' in js
          assert 'function makeDoctor()' in js
          assert '.companion-shortcuts' in css
          assert "'./companion.js'" in sw and "'./companion.css'" in sw
          assert 'dnevnik-v47' in sw
          assert 'checkin.insertAdjacentElement("afterend",box)' in js
          assert 'makeDirectory()' in js and 'makeReturnLinks()' in js
          assert 'companionCalmShortcut' in js
          assert 'companionInsightsEmpty' in js
          assert 'n==="trend"||n==="universe"' in html
          assert '.companion-directory-btn' in css
          assert '<link rel="stylesheet" href="polish.css">' in html
          assert "'./polish.css'" in sw
          assert 'ui-page-enter' in html
          assert 'polish-page-appear' in polish
          assert '@media(prefers-reduced-motion:reduce)' in polish
          assert 'Keep the view steady after saving' in html
          assert html.count('static.cloudflareinsights.com/beacon.min.js') == 1
          assert '342bf07a0bc54c9d8d2e428af5daa254' in html
          assert '&quot;' not in html.split('data-cf-beacon=')[1].split('</script>')[0]
          assert '"spa":false' in html
          assert 'Личные отметки, ответы и заметки не отправляются в статистику посещений' in html
          assert 'не использует аккаунты, аналитику и сторонние сервисы' not in html
          assert 'cloudflareinsights.com' not in sw
          assert '<link rel="stylesheet" href="feedback.css">' in html
          assert "'./feedback.css'" in sw
          assert '#nav{grid-template-columns:repeat(5' in feedback
          assert '<span>Трекер</span>' in html
          assert 'id="navAdd"' in html and 'function shareText(period)' in html
          assert 'id="shareDlg"' in html and 'id="shareWeek"' in html and 'id="shareToday"' in html
          assert '01 / БЫСТРЫЙ ТРЕКЕР' not in html
          assert 'companionCalmShortcut' in js
          assert 'id="promptText"' in html
          assert html.count('id="promptText"') == 1
          assert html.index('id="quickExtras"') < html.index('id="promptText"') < html.index('id="noteBlock"')
          assert 'notes:' not in html.split('function shareText(period)')[1].split('function updateShare()')[0]
          assert 'navigator.share({title:' in html
          assert 'id="quickSaveExtras"' in html
          assert '#tab-today #quickSaveExtras.btn.sec' in feedback
          print('OK: UX3 and compatibility invariants passed')
          PY
      - name: Mobile browser rendering smoke test
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dnevnik-ux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chromium available"; exit 1
          fi
          "$CHROME" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=4500 --window-size=390,844 --dump-dom http://127.0.0.1:8765/index.html > /tmp/dnevnik-ux-mobile.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/dnevnik-ux-mobile.html').read_text(encoding='utf-8')
          for node in ['id="scales"', 'id="companionHome"', 'id="companionCalmShortcut"', 'id="companionDirectory"', 'id="companionEventSection"', 'id="companionInsightSection"', 'id="companionInsightsEmpty"', 'id="companionDoctorPrep"', 'id="navAdd"', 'id="shareDlg"', 'id="shareWeek"', 'id="shareToday"']:
              assert node in html, f'Missing rendered node: {node}'
          assert html.index('id="scales"') < html.index('id="companionHome"') < html.index('id="after"'), 'Check-in is not before optional shortcuts'
          assert html.index('id="companionDirectory"') < html.index('class="guide-entry"'), 'Directory is not first in More'
          print('Rendered mobile DOM passed: check-in is first, all five tools are mounted')
          PY
